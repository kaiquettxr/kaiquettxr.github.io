<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaique Teixeira — Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#101114; --ink-900:#1A1C20; --ink-800:#25282E; --line:#3A3D44;
    --paper:#F1EEE6; --text-hi:#F5F3EC; --text-mid:#B7B9BE;
    --amber:#F2A93B; --red:#E1483D; --steel:#5C8AA6; --wine:#A5556A; --graphite:#8A8F98;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  body{ background:var(--ink-950); color:var(--text-hi); font-family:'Inter',sans-serif; line-height:1.5; overflow-x:hidden; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.01em; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }
  .wrap-narrow{ max-width:820px; margin:0 auto; padding:0 28px; }

  header.nav{ position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(16,17,20,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:1180px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; }
  .nav-logo{ font-size:15px; letter-spacing:0.12em; }
  .nav-logo b{ color:var(--amber); }
  .back-link{ font-size:12px; letter-spacing:0.08em; color:var(--text-mid); transition:color .2s; }
  .back-link:hover{ color:var(--text-hi); }

  /* ---------- HERO ---------- */
  .p-hero{
    position:relative; min-height:70vh; display:flex; flex-direction:column; justify-content:flex-end;
    padding:140px 0 60px; background:var(--ink-900); overflow:hidden;
  }
  .p-hero-media{ position:absolute; inset:0; z-index:0; }
  .p-hero-media img{ width:100%; height:100%; object-fit:cover; object-position:center 22%; }
  .p-hero-media::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(16,17,20,0.15) 0%, rgba(16,17,20,0.55) 55%, var(--ink-950) 100%); }
  .p-hero-shimmer{ position:absolute; inset:0; z-index:0; background:linear-gradient(100deg, var(--ink-900) 40%, #2a2d33 50%, var(--ink-900) 60%); background-size:200% 100%; animation:shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer{ 0%{ background-position:200% 0;} 100%{ background-position:-200% 0;} }
  .p-hero-inner{ position:relative; z-index:1; }
  .tag{ display:inline-flex; align-items:center; gap:7px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:6px 10px; border:1px solid var(--line); width:fit-content; margin-bottom:20px; color:var(--text-mid); background:rgba(16,17,20,0.55); backdrop-filter:blur(4px); }
  .tag .sq{ width:7px; height:7px; }
  .p-hero h1{ font-size:clamp(36px,7vw,76px); line-height:0.98; margin-bottom:14px; text-shadow:0 2px 24px rgba(0,0,0,0.4); }
  .p-meta{ font-size:12px; color:var(--text-mid); letter-spacing:0.06em; margin-bottom:20px; }
  .p-blurb{ max-width:640px; font-size:15.5px; color:var(--text-hi); line-height:1.65; opacity:0.92; }

  .p-hero-inner > *{ opacity:0; animation:pIn .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .p-hero-inner > *:nth-child(1){ animation-delay:.05s; }
  .p-hero-inner > *:nth-child(2){ animation-delay:.13s; }
  .p-hero-inner > *:nth-child(3){ animation-delay:.21s; }
  .p-hero-inner > *:nth-child(4){ animation-delay:.29s; }
  @keyframes pIn{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .p-hero-inner > *{ animation:none; opacity:1; } }

  /* ---------- VIDEO ---------- */
  .video-section{ padding:60px 0 0; }
  .video-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:var(--ink-900); border:1px solid var(--line); }
  .video-wrap iframe{ width:100%; height:100%; border:0; }

  /* ---------- GALLERY (masonry-ish, varied sizes) ---------- */
  .gallery-section{ padding:60px 0 20px; }
  .gallery-label{ font-size:11px; letter-spacing:0.14em; color:var(--text-mid); text-transform:uppercase; margin-bottom:22px; }
  .gallery{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .gallery-item{ display:block; overflow:hidden; border:1px solid var(--line); position:relative; background:var(--ink-900); grid-column:span 3; aspect-ratio:4/3; }
  .gallery-item.wide{ grid-column:span 6; aspect-ratio:16/9; }
  .gallery-item.tall{ grid-column:span 2; aspect-ratio:3/4; }
  .gallery-item.med{ grid-column:span 3; aspect-ratio:1/1; }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; border:0; display:block; transition:transform .5s cubic-bezier(.2,.7,.2,1); opacity:0; animation:imgIn .6s ease forwards; }
  .gallery-item:hover img{ transform:scale(1.06); }
  @keyframes imgIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .gallery-item img{ animation:none; opacity:1; } }
  @media (max-width:760px){
    .gallery{ grid-template-columns:repeat(2,1fr); }
    .gallery-item, .gallery-item.tall, .gallery-item.med{ grid-column:span 1; aspect-ratio:4/3; }
    .gallery-item.wide{ grid-column:span 2; }
  }

  .empty-state{
    border:1px dashed var(--line); padding:60px 30px; text-align:center; color:var(--text-mid);
    font-size:13px; letter-spacing:0.04em; margin:20px 0 60px;
  }
  .empty-state b{ display:block; color:var(--text-hi); font-family:'JetBrains Mono',monospace; letter-spacing:0.1em; margin-bottom:10px; font-size:12px; }

  /* ---------- ALSO LIKE ---------- */
  .also-like{ padding:80px 0 110px; border-top:1px solid var(--line); margin-top:60px; }
  .also-like h2{ font-size:13px; letter-spacing:0.14em; color:var(--text-mid); text-transform:uppercase; margin-bottom:26px; }
  .also-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .also-card{ border:1px solid var(--line); overflow:hidden; transition:border-color .25s, transform .25s; position:relative; }
  .also-card-media{ position:relative; aspect-ratio:4/3; background:var(--ink-900); overflow:hidden; }
  .also-card-media img{ width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .also-card:hover .also-card-media img{ transform:scale(1.08); }
  .also-card-body{ padding:16px 18px 18px; }
  .also-card h4{ font-size:15px; margin:6px 0 6px; transition:color .2s; }
  .also-card:hover h4{ color:var(--amber); }
  .also-card .meta{ font-size:10px; color:var(--text-mid); font-family:'JetBrains Mono',monospace; letter-spacing:0.06em; }
  .also-card:hover{ border-color:var(--amber); transform:translateY(-4px); }

  footer{ background:var(--ink-950); border-top:1px solid var(--line); padding:26px 0; }
  .foot-inner{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--text-mid); letter-spacing:0.05em; }
  .foot-inner a{ transition:color .2s; }
  .foot-inner a:hover{ color:var(--amber); }

  @media (max-width:640px){
    .also-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="nav-logo mono">KAIQUE<b>·</b>TEIXEIRA</div>
    <a class="back-link mono" href="index.html#work">← BACK TO WORK</a>
  </div>
</header>

<section class="p-hero" id="pHero">
  <div class="wrap p-hero-inner" id="projectRoot">
    <!-- Filled in by JS below -->
  </div>
</section>

<main id="projectBody"></main>

<section class="wrap also-like">
  <h2 class="mono">You may also like</h2>
  <div class="also-grid" id="alsoGrid"></div>
</section>

<footer>
  <div class="wrap foot-inner mono">
    <span>© KAIQUE TEIXEIRA — SCOPE STUDIOS</span>
    <a href="index.html#contact">GET IN TOUCH →</a>
  </div>
</footer>

<script src="projects.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('p');
  var project = PROJECTS.find(function(p){ return p.slug === slug; });
  var root = document.getElementById('projectRoot');
  var body = document.getElementById('projectBody');
  var heroSection = document.getElementById('pHero');

  var catColors = { sports:'var(--steel)', brand:'var(--amber)', music:'var(--wine)', events:'var(--graphite)' };
  var catLabels = { sports:'Sports', brand:'Brand & Commercial', music:'Music & Entertainment', events:'Events & Personal' };

  if(!project){
    root.innerHTML = '<h1 class="display">Project not found</h1><p style="margin-top:16px;color:var(--text-mid)">Check the link, or <a href="index.html#work" style="color:var(--amber)">go back to the work section</a>.</p>';
  } else {
    document.title = 'Kaique Teixeira — ' + project.name;

    // Hero content (title/tag/blurb) over the cover photo
    var heroHTML = '';
    heroHTML += '<div class="tag mono"><span class="sq" style="background:'+catColors[project.category]+'"></span>'+catLabels[project.category]+'</div>';
    heroHTML += '<h1 class="display">'+project.name+'</h1>';
    heroHTML += '<div class="p-meta mono">ROLE — '+(project.role || '—').toUpperCase()+' · '+project.year+'</div>';
    if(project.blurb){ heroHTML += '<p class="p-blurb">'+project.blurb+'</p>'; }
    root.innerHTML = heroHTML;

    // Hero background: cover photo (with shimmer-while-loading), or dark plate if none
    if(project.cover){
      var shimmer = document.createElement('div');
      shimmer.className = 'p-hero-shimmer';
      var mediaWrap = document.createElement('div');
      mediaWrap.className = 'p-hero-media';
      var heroImg = document.createElement('img');
      heroImg.alt = project.name;
      heroImg.loading = 'eager';
      heroImg.style.opacity = '0';
      heroImg.style.transition = 'opacity .5s';
      heroImg.onload = function(){ heroImg.style.opacity = '1'; shimmer.remove(); };
      heroImg.onerror = function(){ shimmer.remove(); };
      heroImg.src = project.cover;
      mediaWrap.appendChild(heroImg);
      heroSection.insertBefore(shimmer, heroSection.firstChild);
      heroSection.insertBefore(mediaWrap, heroSection.firstChild);
    }

    var bodyHTML = '';
    var hasMedia = false;

    // Video block(s) (if present) — shown prominently, right below the hero.
    // project.videos is an array so multi-video projects (e.g. Elenko Sports) show every video.
    var projectVideos = project.videos || (project.video ? [project.video] : []);
    if(projectVideos.length){
      hasMedia = true;
      projectVideos.forEach(function(videoSrc, vi){
        bodyHTML += '<section class="video-section"><div class="wrap-narrow">'
          + (projectVideos.length > 1 ? '<div class="gallery-label mono">Video ' + (vi+1) + ' of ' + projectVideos.length + '</div>' : '')
          + '<div class="video-wrap"><iframe src="'+videoSrc+'" allowfullscreen loading="lazy"></iframe></div></div></section>';
      });
    }

    // Gallery — uses ONLY project.images (cover already lives in the hero, never duplicated here)
    var galleryImages = (project.images && project.images.length) ? project.images : [];
    if(galleryImages.length){
      hasMedia = true;
      var sizeCycle = ['med','wide','tall','med','med','wide','tall','med'];
      bodyHTML += '<section class="gallery-section"><div class="wrap">';
      bodyHTML += '<div class="gallery-label mono">Gallery — ' + galleryImages.length + ' photo' + (galleryImages.length > 1 ? 's' : '') + '</div>';
      bodyHTML += '<div class="gallery">';
      galleryImages.forEach(function(src, i){
        var sizeClass = sizeCycle[i % sizeCycle.length];
        var delay = Math.min(i, 8) * 0.06;
        bodyHTML += '<div class="gallery-item ' + sizeClass + '" style="animation-delay:'+delay+'s">'
          + '<img src="'+src+'" loading="lazy" alt="'+project.name+' photo '+(i+1)+'" style="animation-delay:'+delay+'s">'
          + '</div>';
      });
      bodyHTML += '</div></div></section>';
    }

    if(!hasMedia && !project.cover){
      bodyHTML += '<div class="wrap"><div class="empty-state mono"><b>NO SIGNAL</b>Gallery coming soon — add photos or a video link for &ldquo;'+project.name+'&rdquo; in projects.js</div></div>';
    }

    body.innerHTML = bodyHTML;

    // You may also like: 3 other projects, same category first — now with real cover photos
    var others = PROJECTS.filter(function(p){ return p.slug !== project.slug; });
    others.sort(function(a,b){
      var aMatch = a.category === project.category ? 0 : 1;
      var bMatch = b.category === project.category ? 0 : 1;
      return aMatch - bMatch;
    });
    var picks = others.slice(0, 3);
    var alsoHTML = '';
    picks.forEach(function(p){
      var mediaHTML = p.cover
        ? '<img src="'+p.cover+'" alt="'+p.name+'" loading="lazy">'
        : '';
      alsoHTML += '<a class="also-card" href="project.html?p='+p.slug+'">';
      alsoHTML += '<div class="also-card-media">'+mediaHTML+'</div>';
      alsoHTML += '<div class="also-card-body">';
      alsoHTML += '<div class="tag mono" style="margin-bottom:0;"><span class="sq" style="background:'+catColors[p.category]+'"></span>'+catLabels[p.category]+'</div>';
      alsoHTML += '<h4>'+p.name+'</h4>';
      alsoHTML += '<div class="meta">'+p.year+'</div>';
      alsoHTML += '</div></a>';
    });
    document.getElementById('alsoGrid').innerHTML = alsoHTML;
  }
</script>
</body>
</html>
